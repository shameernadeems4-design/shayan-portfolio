<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Logo presentation for Bloom Atelier, an elegant radial petal mark">
  <defs>
    <g id="mark">
      <g stroke="#647d5f" stroke-width="2.5" fill="none">
        <ellipse rx="30" ry="96" cy="-8" transform="rotate(0)"/>
        <ellipse rx="30" ry="96" cy="-8" transform="rotate(45)"/>
        <ellipse rx="30" ry="96" cy="-8" transform="rotate(90)"/>
        <ellipse rx="30" ry="96" cy="-8" transform="rotate(135)"/>
      </g>
      <circle r="22" fill="#d9a7a0"/>
    </g>
  </defs>
  <rect width="1200" height="900" fill="#f5f2ea"/>
  <rect x="28" y="28" width="1144" height="844" fill="none" stroke="#0a0a0b" stroke-opacity="0.08"/>
  <text x="64" y="78" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="6" fill="#6d6a63">LOGO PRESENTATION</text>
  <text x="1136" y="78" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="4" fill="#a0645c">ELEGANT &#183; ORGANIC</text>
  <rect x="64" y="112" width="1072" height="500" fill="#f6f1ec"/>
  <rect x="64" y="112" width="1072" height="500" fill="none" stroke="#0a0a0b" stroke-opacity="0.06"/>
  <g transform="translate(600,300) scale(0.95)"><use href="#mark"/></g>
  <text x="600" y="556" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="36" letter-spacing="8" fill="#3f4a38">BLOOM ATELIER</text>
  <line x1="64" y1="648" x2="1136" y2="648" stroke="#0a0a0b" stroke-opacity="0.1"/>
  <line x1="421" y1="648" x2="421" y2="860" stroke="#0a0a0b" stroke-opacity="0.1"/>
  <line x1="779" y1="648" x2="779" y2="860" stroke="#0a0a0b" stroke-opacity="0.1"/>
  <text x="242" y="700" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="5" fill="#6d6a63">MARK</text>
  <text x="600" y="700" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="5" fill="#6d6a63">INVERSE</text>
  <text x="957" y="700" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="5" fill="#6d6a63">WORDMARK</text>
  <g transform="translate(242,795) scale(0.34)"><use href="#mark"/></g>
  <rect x="505" y="748" width="190" height="96" rx="6" fill="#647d5f"/>
  <text x="600" y="808" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" letter-spacing="4" fill="#f6f1ec">BLOOM</text>
  <text x="957" y="812" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" letter-spacing="5" fill="#3f4a38">BLOOM</text>
</svg>
