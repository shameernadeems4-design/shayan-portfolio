<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Logo presentation for Foundry Supply, a bold industrial monogram">
  <defs>
    <g id="mark">
      <rect x="-100" y="-100" width="200" height="200" fill="#101012"/>
      <rect x="-100" y="72" width="200" height="28" fill="#e2622b"/>
      <text y="52" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif" font-size="150" fill="#f1efe9">F</text>
    </g>
  </defs>
  <rect width="1200" height="900" fill="#f5f2ea"/>
  <rect x="28" y="28" width="1144" height="844" fill="none" stroke="#0a0a0b" stroke-opacity="0.08"/>
