<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Close-up of letterhead and notebook cover stationery design">
  <defs>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#2f321f" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="#ded5c3"/>

  <!-- letterhead close-up -->
  <g filter="url(#sh)">
    <rect x="90" y="110" width="640" height="700" fill="#f4f1ea"/>
    <path d="M170 196 C 224 196 250 226 250 268 L250 372 L90 372 L90 268 C 90 226 116 196 170 196 Z" fill="none" stroke="#16281f" stroke-width="8"/>
    <path d="M170 238 C 200 238 214 258 214 284 L214 372 L126 372 L126 284 C 126 258 140 238 170 238 Z" fill="#16281f"/>
    <text x="290" y="268" font-family="Georgia, 'Times New Roman', serif" font-size="46" fill="#16281f">Maison Verte</text>
    <text x="292" y="308" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="7" fill="#5c7a63">INTERIOR · PLANTS · LIGHT</text>
    <line x1="170" y1="404" x2="690" y2="404" stroke="#16281f" stroke-opacity="0.2"/>
    <text x="170" y="452" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4c4a45">Dear Ana,</text>
    <text x="170" y="500" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6f6a63">Thank you for the walkthrough on Thursday. The north-facing</text>
    <text x="170" y="526" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6f6a63">windows will take a grouping of three low-light species, so I</text>
    <text x="170" y="552" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6f6a63">have revised the plan and attached it for review.</text>
    <text x="170" y="600" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6f6a63">Kind regards,</text>
    <text x="170" y="646" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#16281f">S. Nadeem</text>
    <line x1="170" y1="676" x2="330" y2="676" stroke="#16281f" stroke-opacity="0.3"/>
    <text x="170" y="712" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="3" fill="#8a8579">STUDIO 4 · EXAMPLE STREET · CITY</text>
    <text x="170" y="736" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="3" fill="#8a8579">HELLO@EXAMPLE.COM · +00 000 000 0000</text>
    <text x="170" y="770" font-family="Helvetica, Arial, sans-serif" font-size="10" letter-spacing="3" fill="#a8a49b">120GSM UNCOATED · BASELINE GRID 12PT</text>
  </g>

  <!-- notebook -->
  <g filter="url(#sh)" transform="rotate(4 950 460)">
    <rect x="790" y="180" width="340" height="560" fill="#16281f"/>
    <rect x="790" y="180" width="20" height="560" fill="#0e1a14"/>
    <path d="M920 350 C 958 350 976 374 976 406 L976 480 L864 480 L864 406 C 864 374 882 350 920 350 Z" fill="none" stroke="#c9a227" stroke-width="6"/>
    <text x="1000" y="440" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#f4f1ea">Notes</text>
    <rect x="864" y="530" width="240" height="1.4" fill="#c9a227" opacity="0.6"/>
    <text x="864" y="576" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="4" fill="#8d8a80">A5 · 120GSM INNER · SEWN</text>
    <text x="864" y="660" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#c9a227">Maison Verte</text>
  </g>

  <text x="90" y="868" font-family="Helvetica, Arial, sans-serif" font-size="14" letter-spacing="5" fill="#6f6a63">SUITE DETAIL — LETTERHEAD MARGINS &amp; NOTEBOOK COVER</text>
</svg>
