<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Coffee packaging mockup with cream and forest bands">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141a16"/>
      <stop offset="1" stop-color="#0a0d0b"/>
    </linearGradient>
    <linearGradient id="pouchA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4ede0"/>
      <stop offset="0.5" stop-color="#efe6d6"/>
      <stop offset="1" stop-color="#ddd2be"/>
    </linearGradient>
    <linearGradient id="pouchB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1b3327"/>
      <stop offset="1" stop-color="#12251c"/>
    </linearGradient>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="26" stdDeviation="26" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <ellipse cx="600" cy="770" rx="470" ry="90" fill="#000000" opacity="0.5" filter="url(#blur)"/>

  <!-- pouch 1 -->
  <g filter="url(#sh)" transform="rotate(-4 400 430)">
    <path d="M250 170 L520 170 L520 740 L250 740 Z" fill="url(#pouchA)"/>
    <path d="M250 170 L520 170 L520 212 L250 212 Z" fill="#12251c"/>
    <rect x="250" y="300" width="270" height="150" fill="#12251c"/>
    <text x="385" y="368" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#efe7d8">Nova</text>
    <text x="385" y="408" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#efe7d8">Roast</text>
    <rect x="286" y="486" width="198" height="1.4" fill="#c98a4b"/>
    <text x="385" y="524" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="6" fill="#5f6b5c">SINGLE ORIGIN</text>
    <rect x="286" y="580" width="198" height="96" fill="#f4ede0" stroke="#12251c" stroke-opacity="0.35" stroke-dasharray="5 5"/>
    <text x="385" y="622" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="4" fill="#83807a">LABEL WINDOW</text>
    <text x="385" y="648" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#12251c">Medium roast · 250g</text>
    <text x="385" y="706" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" letter-spacing="3" fill="#7d8577">2-COLOUR FLEXO</text>
  </g>

  <!-- pouch 2 -->
  <g filter="url(#sh)" transform="rotate(3 800 440)">
    <path d="M690 200 L960 200 L960 750 L690 750 Z" fill="url(#pouchB)"/>
    <path d="M690 200 L960 200 L960 242 L690 242 Z" fill="#0c1710"/>
    <rect x="690" y="330" width="270" height="140" fill="#efe7d8"/>
    <text x="825" y="398" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="42" fill="#12251c">Nova</text>
    <text x="825" y="438" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="42" fill="#12251c">Roast</text>
    <rect x="726" y="520" width="198" height="1.4" fill="#8c9a86"/>
    <text x="825" y="558" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="6" fill="#8c9a86">DARK ROAST</text>
    <text x="825" y="628" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#cfd8cb">Cocoa · Walnut · Toffee</text>
    <text x="825" y="700" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" letter-spacing="3" fill="#6f7d6c">250G · WHOLE BEAN</text>
  </g>

  <text x="110" y="150" font-family="Helvetica, Arial, sans-serif" font-size="15" letter-spacing="5" fill="#8f8b83">PRINT STUDY — POUCH / DIE-LINE</text>
  <text x="1090" y="150" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="15" letter-spacing="5" fill="#c98a4b">09</text>
</svg>
