<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Three coffee packaging designs shown as a set on a shelf">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171d19"/>
      <stop offset="1" stop-color="#0a0d0b"/>
    </linearGradient>
    <linearGradient id="sh1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4ede0"/><stop offset="1" stop-color="#ddd2be"/>
    </linearGradient>
    <linearGradient id="sh2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1b3327"/><stop offset="1" stop-color="#12251c"/>
    </linearGradient>
    <linearGradient id="sh3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a2415"/><stop offset="1" stop-color="#241509"/>
    </linearGradient>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect x="0" y="700" width="1200" height="10" fill="#242a24"/>
  <ellipse cx="600" cy="722" rx="500" ry="40" fill="#000000" opacity="0.55" filter="url(#blur)"/>

  <g filter="url(#sh)">
    <path d="M110 300 L280 300 L280 700 L110 700 Z" fill="url(#sh1)"/>
    <path d="M110 300 L280 300 L280 330 L110 330 Z" fill="#12251c"/>
    <text x="195" y="420" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#12251c">Nova</text>
    <text x="195" y="450" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#12251c">Roast</text>
    <text x="195" y="500" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" letter-spacing="4" fill="#5f6b5c">ETHIOPIA</text>
    <text x="195" y="524" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#7d8577">Light · Floral</text>
    <rect x="140" y="600" width="110" height="46" fill="#f4ede0" stroke="#12251c" stroke-opacity="0.3" stroke-dasharray="4 4"/>

    <path d="M465 240 L635 240 L635 700 L465 700 Z" fill="url(#sh2)"/>
    <path d="M465 240 L635 240 L635 272 L465 272 Z" fill="#0c1710"/>
    <text x="550" y="380" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#efe7d8">Nova</text>
    <text x="550" y="414" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#efe7d8">Roast</text>
    <rect x="500" y="446" width="100" height="1.2" fill="#c98a4b"/>
    <text x="550" y="494" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" letter-spacing="4" fill="#c98a4b">HOUSE BLEND</text>
    <text x="550" y="518" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#8c9a86">Medium · Cocoa</text>
    <text x="550" y="640" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" letter-spacing="3" fill="#6f7d6c">250G · WHOLE BEAN</text>

    <path d="M820 300 L990 300 L990 700 L820 700 Z" fill="url(#sh3)"/>
    <path d="M820 300 L990 300 L990 330 L820 330 Z" fill="#1c1007"/>
    <text x="905" y="420" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#f4ede0">Nova</text>
    <text x="905" y="450" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#f4ede0">Roast</text>
    <text x="905" y="500" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" letter-spacing="4" fill="#c98a4b">COLOMBIA</text>
    <text x="905" y="524" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#a98c6f">Dark · Toffee</text>
  </g>

  <text x="110" y="800" font-family="Helvetica, Arial, sans-serif" font-size="14" letter-spacing="5" fill="#8f8b83">RANGE SET — THREE ROASTS, ONE TWO-COLOUR SYSTEM</text>
  <text x="110" y="840" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#efe7d8">Shelf impact without extra print cost</text>
</svg>
