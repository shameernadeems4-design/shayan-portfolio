<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Stationery suite mockup with letterhead, card and envelope">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7e0d2"/>
      <stop offset="1" stop-color="#d3c9b6"/>
    </linearGradient>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#2f321f" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- letterhead -->
  <g filter="url(#sh)" transform="rotate(-2 430 420)">
    <rect x="130" y="150" width="600" height="600" fill="#f4f1ea"/>
    <path d="M190 214 C 240 214 262 240 262 278 L262 366 L118 366 L118 278 C 118 240 140 214 190 214 Z" fill="none" stroke="#16281f" stroke-width="7"/>
    <path d="M190 250 C 218 250 230 268 230 292 L230 366 L150 366 L150 292 C 150 268 162 250 190 250 Z" fill="#16281f"/>
    <text x="300" y="280" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#16281f">Maison Verte</text>
    <text x="302" y="318" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="7" fill="#5c7a63">INTERIOR · PLANTS · LIGHT</text>
    <line x1="190" y1="640" x2="670" y2="640" stroke="#16281f" stroke-opacity="0.25"/>
    <text x="190" y="676" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="4" fill="#7a766c">STUDIO ADDRESS LINE · CITY · COUNTRY</text>
    <text x="190" y="700" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="4" fill="#7a766c">HELLO@EXAMPLE.COM   +00 000 000 0000</text>
    <text x="190" y="410" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#4c4a45">A baseline grid of 12pt keeps every item in the suite</text>
    <text x="190" y="436" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#4c4a45">aligned — from the letterhead to the notebook cover.</text>
  </g>

  <!-- envelope -->
  <g filter="url(#sh)" transform="rotate(3 850 400)">
    <rect x="640" y="180" width="440" height="300" fill="#16281f"/>
    <path d="M640 180 L860 340 L1080 180" fill="none" stroke="#f4f1ea" stroke-opacity="0.18" stroke-width="2"/>
    <path d="M700 246 C 736 246 754 266 754 296 L754 366 L646 366 L646 296 C 646 266 664 246 700 246 Z" fill="none" stroke="#c9a227" stroke-width="5"/>
    <text x="790" y="320" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#f4f1ea">Maison Verte</text>
    <text x="792" y="348" font-family="Helvetica, Arial, sans-serif" font-size="10" letter-spacing="5" fill="#c9a227">DL ENVELOPE</text>
  </g>

  <!-- notebook -->
  <g filter="url(#sh)" transform="rotate(-3 880 660)">
    <rect x="700" y="520" width="360" height="250" fill="#16281f"/>
    <rect x="700" y="520" width="18" height="250" fill="#0e1a14"/>
    <rect x="760" y="580" width="200" height="1.4" fill="#c9a227" opacity="0.7"/>
    <text x="760" y="640" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#f4f1ea">Notes</text>
    <text x="760" y="666" font-family="Helvetica, Arial, sans-serif" font-size="10" letter-spacing="4" fill="#8d8a80">A5 · 120GSM INNER</text>
  </g>

  <text x="110" y="120" font-family="Helvetica, Arial, sans-serif" font-size="15" letter-spacing="5" fill="#7a766c">PRINT STUDY — STATIONERY SUITE</text>
  <text x="1090" y="120" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="15" letter-spacing="5" fill="#b1822c">12</text>
</svg>
