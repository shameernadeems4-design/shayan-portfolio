<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Halcyon skincare social campaign key visual">
  <defs>
    <linearGradient id="linen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f4f0"/>
      <stop offset="1" stop-color="#e7e1d8"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfd8cd"/>
    </linearGradient>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#3b3327" flood-opacity="0.28"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#linen)"/>
  <ellipse cx="880" cy="210" rx="330" ry="210" fill="#8b9e8f" opacity="0.30" filter="url(#soft)"/>
  <ellipse cx="250" cy="760" rx="300" ry="200" fill="#d9c9b4" opacity="0.45" filter="url(#soft)"/>

  <g filter="url(#sh)">
    <rect x="200" y="330" width="150" height="330" rx="18" fill="url(#glass)"/>
    <rect x="200" y="330" width="150" height="60" rx="10" fill="#1b1b1b" opacity="0.85"/>
    <rect x="232" y="430" width="86" height="1.5" fill="#1b1b1b" opacity="0.5"/>
    <text x="275" y="500" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#1b1b1b">Halcyon</text>
    <text x="275" y="528" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" letter-spacing="3" fill="#6f6a60">SERUM 30ML</text>
    <rect x="380" y="290" width="150" height="370" rx="18" fill="url(#glass)"/>
    <rect x="380" y="290" width="150" height="60" rx="10" fill="#1b1b1b" opacity="0.85"/>
    <rect x="412" y="400" width="86" height="1.5" fill="#1b1b1b" opacity="0.5"/>
    <text x="455" y="470" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#1b1b1b">Halcyon</text>
    <text x="455" y="498" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" letter-spacing="3" fill="#6f6a60">CREAM 50ML</text>
  </g>

  <g filter="url(#sh)">
    <rect x="620" y="150" width="440" height="600" rx="4" fill="#eae4dc"/>
    <rect x="620" y="150" width="440" height="600" rx="4" fill="none" stroke="#1b1b1b" stroke-opacity="0.12"/>
    <text x="660" y="230" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="6" fill="#8b9e8f">THE ROUTINE</text>
    <text x="660" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="54" fill="#1b1b1b">Quietly</text>
    <text x="660" y="392" font-family="Georgia, 'Times New Roman', serif" font-size="54" fill="#1b1b1b">effective.</text>
    <line x1="660" y1="446" x2="1020" y2="446" stroke="#1b1b1b" stroke-opacity="0.25"/>
    <text x="660" y="492" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#4c4a45">Three steps. Two minutes. One</text>
    <text x="660" y="518" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#4c4a45">routine your skin will keep.</text>
    <rect x="660" y="574" width="128" height="34" rx="17" fill="#1b1b1b"/>
    <text x="724" y="596" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="2" fill="#f6f4f0">DISCOVER</text>
    <rect x="800" y="574" width="128" height="34" rx="17" fill="none" stroke="#1b1b1b" stroke-opacity="0.35"/>
    <text x="864" y="596" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="2" fill="#1b1b1b">THE SET</text>
  </g>

  <text x="60" y="840" font-family="Helvetica, Arial, sans-serif" font-size="15" letter-spacing="5" fill="#8f8b83">CONCEPT STUDY — SOCIAL CAMPAIGN</text>
  <text x="1140" y="840" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="15" letter-spacing="5" fill="#8b9e8f">02</text>
</svg>
