<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Three-frame carousel design showing a skincare routine">
  <defs>
    <linearGradient id="linen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f4f0"/>
      <stop offset="1" stop-color="#e7e1d8"/>
    </linearGradient>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#3b3327" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="#f1ede5"/>

  <g filter="url(#sh)">
    <rect x="90" y="220" width="300" height="460" fill="#ffffff"/>
    <text x="118" y="288" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="5" fill="#8b9e8f">STEP 01</text>
    <text x="118" y="356" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#1b1b1b">Cleanse</text>
    <rect x="118" y="384" width="180" height="1.5" fill="#1b1b1b" opacity="0.2"/>
    <text x="118" y="424" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4c4a45">A gentle daily wash that</text>
    <text x="118" y="446" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4c4a45">never leaves skin tight.</text>
    <rect x="118" y="560" width="120" height="220" rx="14" fill="#eee8de" stroke="#1b1b1b" stroke-opacity="0.1"/>
    <rect x="118" y="520" width="120" height="40" rx="8" fill="#1b1b1b" opacity="0.8"/>

    <rect x="450" y="190" width="300" height="520" fill="#ffffff"/>
    <text x="478" y="262" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="5" fill="#8b9e8f">STEP 02</text>
    <text x="478" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#1b1b1b">Treat</text>
    <rect x="478" y="358" width="180" height="1.5" fill="#1b1b1b" opacity="0.2"/>
    <text x="478" y="398" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4c4a45">A light serum with one job:</text>
    <text x="478" y="420" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4c4a45">calmer, even-looking skin.</text>
    <rect x="478" y="480" width="150" height="180" rx="18" fill="#e2e6e0"/>
    <rect x="478" y="440" width="150" height="46" rx="10" fill="#1b1b1b" opacity="0.85"/>
    <text x="553" y="700" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="4" fill="#8b9e8f">SWIPE</text>

    <rect x="810" y="220" width="300" height="460" fill="#ffffff"/>
    <text x="838" y="288" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="5" fill="#8b9e8f">STEP 03</text>
    <text x="838" y="356" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#1b1b1b">Protect</text>
    <rect x="838" y="384" width="180" height="1.5" fill="#1b1b1b" opacity="0.2"/>
    <text x="838" y="424" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4c4a45">Daily moisture that sits</text>
    <text x="838" y="446" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4c4a45">well under makeup.</text>
    <rect x="838" y="520" width="150" height="260" rx="18" fill="#eee8de" stroke="#1b1b1b" stroke-opacity="0.1"/>
    <rect x="838" y="482" width="150" height="40" rx="8" fill="#1b1b1b" opacity="0.8"/>
  </g>

  <text x="90" y="790" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#1b1b1b">One campaign, three consistent frames</text>
  <text x="90" y="828" font-family="Helvetica, Arial, sans-serif" font-size="14" letter-spacing="5" fill="#8f8b83">CAROUSEL SYSTEM — IDENTICAL GRID, DIFFERENT MESSAGE</text>
</svg>
