<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Fitness membership offer card and class schedule design">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161819"/>
      <stop offset="1" stop-color="#0a0b0b"/>
    </linearGradient>
    <pattern id="diag" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="9" height="18" fill="#c6f24e" fill-opacity="0.08"/>
    </pattern>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#diag)"/>

  <g filter="url(#sh)">
    <rect x="100" y="130" width="460" height="300" fill="#f5f2ea"/>
    <rect x="100" y="130" width="14" height="300" fill="#c6f24e"/>
    <text x="150" y="200" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="6" fill="#7c8288">MEMBER PASS</text>
    <text x="150" y="268" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="52" letter-spacing="-1" fill="#111214">12 WEEKS</text>
    <text x="150" y="306" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#3b4046">Structured strength plan + recovery</text>
    <line x1="150" y1="336" x2="520" y2="336" stroke="#111214" stroke-opacity="0.18"/>
    <text x="150" y="374" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#111214">$129 / mo</text>
    <text x="150" y="404" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="3" fill="#7c8288">CANCEL ANYTIME</text>
  </g>

  <g filter="url(#sh)">
    <rect x="100" y="470" width="460" height="310" fill="#111214"/>
    <rect x="100" y="470" width="460" height="310" fill="none" stroke="#c6f24e" stroke-opacity="0.25"/>
    <text x="140" y="524" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="6" fill="#c6f24e">JOINING OFFER</text>
    <text x="140" y="596" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="46" fill="#f5f2ea">FIRST MONTH</text>
    <text x="140" y="644" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="46" fill="#c6f24e">ON US</text>
    <text x="140" y="688" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#9aa0a6">No joining fee · All classes included</text>
    <rect x="140" y="712" width="180" height="44" fill="#c6f24e"/>
    <text x="230" y="740" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="13" letter-spacing="3" fill="#0b0c0d">GET PASS</text>
    <text x="520" y="740" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="3" fill="#6f757b">PULSEATHLETIC.CLUB</text>
  </g>

  <g filter="url(#sh)">
    <rect x="640" y="130" width="460" height="650" fill="#f5f2ea"/>
    <text x="680" y="196" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="6" fill="#7c8288">WEEKLY SCHEDULE</text>
    <text x="680" y="240" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="30" fill="#111214">Classes on the hour</text>
    <line x1="680" y1="270" x2="1060" y2="270" stroke="#111214" stroke-opacity="0.15"/>
    <g>
      <text x="680" y="316" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="16" fill="#111214">MON</text>
      <text x="800" y="316" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#3b4046">Strength — 06:00 / 18:30</text>
      <line x1="680" y1="340" x2="1060" y2="340" stroke="#111214" stroke-opacity="0.1"/>
      <text x="680" y="382" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="16" fill="#111214">TUE</text>
      <text x="800" y="382" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#3b4046">Conditioning — 07:00 / 19:00</text>
      <line x1="680" y1="406" x2="1060" y2="406" stroke="#111214" stroke-opacity="0.1"/>
      <text x="680" y="448" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="16" fill="#111214">WED</text>
      <text x="800" y="448" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#3b4046">Mobility — 12:15 / 20:00</text>
      <line x1="680" y1="472" x2="1060" y2="472" stroke="#111214" stroke-opacity="0.1"/>
      <text x="680" y="514" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="16" fill="#111214">THU</text>
      <text x="800" y="514" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#3b4046">Strength — 06:00 / 18:30</text>
      <line x1="680" y1="538" x2="1060" y2="538" stroke="#111214" stroke-opacity="0.1"/>
      <text x="680" y="580" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="16" fill="#111214">FRI</text>
      <text x="800" y="580" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#3b4046">Sprint circuits — 07:00 / 17:45</text>
      <line x1="680" y1="604" x2="1060" y2="604" stroke="#111214" stroke-opacity="0.1"/>
      <text x="680" y="646" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="16" fill="#111214">SAT</text>
      <text x="800" y="646" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#3b4046">Open gym — 08:00 to 14:00</text>
      <line x1="680" y1="670" x2="1060" y2="670" stroke="#111214" stroke-opacity="0.1"/>
      <text x="680" y="712" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="16" fill="#111214">SUN</text>
      <text x="800" y="712" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#3b4046">Recovery — 09:00</text>
      <line x1="680" y1="736" x2="1060" y2="736" stroke="#111214" stroke-opacity="0.15"/>
    </g>
  </g>

  <text x="100" y="836" font-family="Helvetica, Arial, sans-serif" font-size="14" letter-spacing="5" fill="#8f8b83">MEMBERSHIP ASSETS — OFFER CARD &amp; SCHEDULE</text>
</svg>
