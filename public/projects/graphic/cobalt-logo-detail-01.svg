  <text x="330" y="694" font-family="'Arial Black', Arial, sans-serif" font-size="30" letter-spacing="2" fill="#f5f2ea">COBALT</text>
  <text x="330" y="722" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="6" fill="#2a4bd7">STUDIO</text>
  <rect x="120" y="790" width="60" height="4" fill="#2a4bd7"/>

  <rect x="620" y="530" width="540" height="330" fill="#eef1fd" stroke="#0d0d12" stroke-opacity="0.08"/>
  <text x="644" y="562" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="4" fill="#6d6a63">MERCHANDISE</text>
  <path d="M680 610 h150 v210 a10 10 0 0 1 -10 10 h-130 a10 10 0 0 1 -10 -10 z" fill="#2a4bd7"/>
  <path d="M712 610 v-22 a43 43 0 0 1 86 0 v22" fill="none" stroke="#2a4bd7" stroke-width="7"/>
  <g transform="translate(755,720) scale(0.26)"><use href="#mkw"/></g>
  <text x="755" y="792" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="4" fill="#f5f2ea">COBALT</text>
  <g transform="translate(900,720)">
    <path d="M0 0 l40 -24 h60 l40 24 l-40 90 h-60 z" fill="#0d0d12"/>
