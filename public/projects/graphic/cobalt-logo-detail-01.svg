    <circle cx="906" cy="286" r="12" fill="#2a4bd7"/>
    <text x="906" y="366" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="1" fill="#0d0d12">Ravi Sundaram</text>
    <text x="906" y="386" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="2" fill="#2a4bd7">CREATIVE DIRECTOR</text>
    <rect x="906" y="398" width="120" height="1" fill="#0d0d12" opacity="0.2"/>
    <text x="906" y="414" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#6f6b64">hello@example.com</text>
  </g>

  <rect x="40" y="530" width="560" height="330" fill="#0d0d12"/>
  <text x="64" y="562" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="4" fill="#8f8b83">SIGNAGE</text>
  <rect x="120" y="600" width="400" height="180" fill="none" stroke="#2a2a34"/>
  <g transform="translate(230,690) scale(0.42)">
