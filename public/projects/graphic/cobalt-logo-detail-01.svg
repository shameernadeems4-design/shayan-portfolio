  <circle cx="500" cy="340" r="26" fill="#2a4bd7"/>
  <g transform="translate(500,340) scale(0.16)"><use href="#mkw"/></g>
  <text x="64" y="432" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2" fill="#8d8a80">ICON &#183; FAVICON &#183; SOCIAL AVATAR</text>
  <text x="64" y="462" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2" fill="#8d8a80">SAFE AREA 25% &#183; ROUNDED 22%</text>

  <rect x="580" y="100" width="580" height="410" fill="#eef1fd" stroke="#0d0d12" stroke-opacity="0.08"/>
