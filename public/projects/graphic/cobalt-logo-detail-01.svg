      <circle cx="94" cy="0" r="15" fill="#0d0d12"/>
    </g>
    <g id="mkw">
      <path d="M70 -70 A100 100 0 1 0 70 70" fill="none" stroke="#f5f2ea" stroke-width="20" stroke-linecap="round"/>
      <circle cx="94" cy="0" r="15" fill="#f5f2ea"/>
    </g>
  </defs>
  <rect width="1200" height="900" fill="#f5f2ea"/>
