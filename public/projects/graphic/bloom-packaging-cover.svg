  </defs>
  <rect width="1200" height="900" fill="#f6f1ec"/>
  <text x="40" y="60" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="6" fill="#6d6a63">PACKAGING SYSTEM</text>
  <text x="1160" y="60" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="16" letter-spacing="4" fill="#3f4a38">BLOOM ATELIER</text>
  <line x1="40" y1="80" x2="1160" y2="80" stroke="#3f4a38" stroke-opacity="0.15"/>

  <rect x="40" y="120" width="1120" height="560" fill="url(#shelf)"/>
  <line x1="40" y1="680" x2="1160" y2="680" stroke="#3f4a38" stroke-opacity="0.2" stroke-width="2"/>

  <g>
    <rect x="180" y="300" width="170" height="380" rx="12" fill="#647d5f"/>
    <rect x="240" y="266" width="50" height="44" rx="6" fill="#3f4a38"/>
