    <text x="265" y="600" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" letter-spacing="3" fill="#f6f1ec">BLOOM</text>
    <text x="265" y="622" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="3" fill="#cfd8c8">ROSE TONIC</text>
  </g>

  <g>
    <rect x="470" y="340" width="220" height="340" rx="4" fill="#f6f1ec" stroke="#3f4a38" stroke-opacity="0.18"/>
    <rect x="470" y="340" width="220" height="10" fill="#d9a7a0"/>
    <g transform="translate(580,470) scale(0.5)"><use href="#mk"/></g>
