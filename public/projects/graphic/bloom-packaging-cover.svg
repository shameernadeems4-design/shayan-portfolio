    <text x="580" y="618" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="3" fill="#a0645c">BOTANICAL SKINCARE</text>
    <text x="580" y="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="2" fill="#8d8a80">50 ML</text>
