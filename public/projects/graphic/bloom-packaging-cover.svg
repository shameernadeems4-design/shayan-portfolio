  <rect x="40" y="712" width="1120" height="150" fill="#fbf8f4" stroke="#3f4a38" stroke-opacity="0.1"/>
  <text x="64" y="744" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="4" fill="#6d6a63">LABEL LOCKUP &amp; DIE-LINE</text>
  <rect x="90" y="772" width="240" height="60" rx="4" fill="#f6f1ec" stroke="#3f4a38" stroke-opacity="0.3"/>
  <rect x="102" y="784" width="216" height="36" fill="none" stroke="#3f4a38" stroke-opacity="0.2"/>
  <text x="210" y="808" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" letter-spacing="3" fill="#3f4a38">BLOOM ATELIER</text>
  <g stroke="#8d8a80" stroke-opacity="0.6">
    <line x1="420" y1="772" x2="420" y2="832" stroke-dasharray="4 5"/>
    <line x1="700" y1="772" x2="700" y2="832" stroke-dasharray="4 5"/>
    <line x1="420" y1="788" x2="700" y2="788" stroke-dasharray="4 5"/>
