<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Bloom Atelier packaging design system with bottle, box and jar on a shelf">
  <defs>
    <g id="mk">
      <g stroke="#647d5f" stroke-width="2.5" fill="none">
        <ellipse rx="30" ry="96" cy="-8"/>
        <ellipse rx="30" ry="96" cy="-8" transform="rotate(45)"/>
        <ellipse rx="30" ry="96" cy="-8" transform="rotate(90)"/>
        <ellipse rx="30" ry="96" cy="-8" transform="rotate(135)"/>
      </g>
      <circle r="22" fill="#d9a7a0"/>
