    <g transform="translate(265,470) scale(0.42)">
      <g stroke="#f6f1ec" stroke-width="3" fill="none">
        <ellipse rx="30" ry="96" cy="-8"/>
        <ellipse rx="30" ry="96" cy="-8" transform="rotate(45)"/>
        <ellipse rx="30" ry="96" cy="-8" transform="rotate(90)"/>
        <ellipse rx="30" ry="96" cy="-8" transform="rotate(135)"/>
      </g>
      <circle r="22" fill="#d9a7a0"/>
