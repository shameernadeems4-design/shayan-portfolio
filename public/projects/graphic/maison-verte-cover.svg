<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Maison Verte brand identity presentation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c3126"/>
      <stop offset="1" stop-color="#101f18"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.7" cy="0.25" r="0.7">
      <stop offset="0" stop-color="#c9a227" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#c9a227" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>

  <!-- identity board -->
  <g filter="url(#sh)">
    <rect x="110" y="120" width="560" height="560" fill="#e9e3d7"/>
    <g transform="translate(390 400)">
      <path d="M0 -120 C 78 -120 120 -74 120 -6 L120 120 L-120 120 L-120 -6 C -120 -74 -78 -120 0 -120 Z" fill="none" stroke="#16281f" stroke-width="10"/>
      <path d="M0 -46 C 40 -46 58 -22 58 8 L58 120 L-58 120 L-58 8 C -58 -22 -40 -46 0 -46 Z" fill="#16281f"/>
      <path d="M0 -120 L0 -46" stroke="#c9a227" stroke-width="6"/>
    </g>
    <text x="390" y="646" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" letter-spacing="8" fill="#5c7a63">PRIMARY MARK</text>
  </g>

  <!-- type specimen board -->
  <g filter="url(#sh)">
    <rect x="720" y="120" width="370" height="270" fill="#f4f1ea"/>
    <text x="756" y="212" font-family="Georgia, 'Times New Roman', serif" font-size="52" fill="#16281f">Maison</text>
    <text x="756" y="266" font-family="Georgia, 'Times New Roman', serif" font-size="52" fill="#16281f">Verte</text>
    <line x1="756" y1="300" x2="1054" y2="300" stroke="#16281f" stroke-opacity="0.2"/>
    <text x="756" y="336" font-family="Helvetica, Arial, sans-serif" font-size="14" letter-spacing="4" fill="#5c7a63">DISPLAY / SANS PAIRING</text>
    <text x="756" y="366" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#7a766c">Aa Bb Cc Dd Ee Ff Gg Hh Ii</text>
  </g>

  <!-- palette board -->
  <g filter="url(#sh)">
    <rect x="720" y="430" width="370" height="250" fill="#e9e3d7"/>
    <text x="756" y="482" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="6" fill="#16281f">COLOUR</text>
    <rect x="756" y="510" width="72" height="120" fill="#16281f"/>
    <rect x="836" y="510" width="72" height="120" fill="#5c7a63"/>
    <rect x="916" y="510" width="72" height="120" fill="#c9a227"/>
    <rect x="996" y="510" width="58" height="120" fill="#e9e3d7" stroke="#16281f" stroke-opacity="0.25"/>
    <text x="756" y="658" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#7a766c">#16281F   #5C7A63   #C9A227   #E9E3D7</text>
  </g>

  <text x="110" y="776" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#e9e3d7">Identity system for a plant-led interior studio</text>
  <text x="110" y="838" font-family="Helvetica, Arial, sans-serif" font-size="15" letter-spacing="5" fill="#8f8b83">CONCEPT STUDY — BRAND IDENTITY</text>
  <text x="1110" y="838" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="15" letter-spacing="5" fill="#c9a227">06</text>
</svg>
