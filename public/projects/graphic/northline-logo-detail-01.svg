<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Northline logo construction sheet with geometry guides, variations and clear space">
  <defs>
    <g id="mk">
      <polygon points="0,-104 104,0 0,104 -104,0" fill="none" stroke="#16233a" stroke-width="3"/>
      <path d="M-46 56 L-46 -56 L46 56 L46 -56" fill="none" stroke="#c0562c" stroke-width="12" stroke-linecap="square" stroke-linejoin="round"/>
    </g>
  </defs>
  <rect width="1200" height="900" fill="#f5f2ea"/>
  <text x="40" y="60" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="6" fill="#6d6a63">LOGO CONSTRUCTION &amp; VARIATIONS</text>
  <text x="1160" y="60" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="4" fill="#c0562c">NORTHLINE</text>
  <line x1="40" y1="80" x2="1160" y2="80" stroke="#16233a" stroke-opacity="0.15"/>

  <rect x="40" y="100" width="620" height="520" fill="#eef1f6" stroke="#16233a" stroke-opacity="0.1"/>
  <text x="64" y="132" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="4" fill="#6d6a63">GEOMETRY</text>
  <g stroke="#2a4bd7" stroke-opacity="0.28">
    <circle cx="350" cy="360" r="150" fill="none" stroke-dasharray="5 6"/>
    <circle cx="350" cy="360" r="104" fill="none"/>
    <line x1="200" y1="360" x2="500" y2="360"/>
    <line x1="350" y1="210" x2="350" y2="510"/>
  </g>
  <g transform="translate(350,360) scale(1.0)"><use href="#mk"/></g>
  <g stroke="#8f8b83" stroke-opacity="0.7" fill="none">
    <line x1="350" y1="210" x2="560" y2="150"/>
    <line x1="500" y1="360" x2="560" y2="360"/>
  </g>
  <text x="566" y="152" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#6d6a63">45&#176; / 90&#176; angles</text>
  <text x="566" y="364" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#6d6a63">1 : 1.618 ratio</text>
  <text x="64" y="596" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2" fill="#8f8b83">THE MARK IS BUILT ON A CIRCLE AND A SQUARE ROTATED 45&#176;</text>

  <rect x="700" y="100" width="460" height="520" fill="#eef1f6" stroke="#16233a" stroke-opacity="0.1"/>
  <text x="724" y="132" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="4" fill="#6d6a63">VARIATIONS</text>
  <g>
    <rect x="724" y="152" width="200" height="200" fill="#f5f2ea" stroke="#16233a" stroke-opacity="0.1"/>
    <g transform="translate(824,240) scale(0.62)"><use href="#mk"/></g>
    <text x="824" y="330" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#6d6a63">PRIMARY</text>
  </g>
  <g>
    <rect x="936" y="152" width="200" height="200" fill="#f5f2ea" stroke="#16233a" stroke-opacity="0.1"/>
    <g transform="translate(1036,240) scale(0.62)">
      <polygon points="0,-104 104,0 0,104 -104,0" fill="none" stroke="#16233a" stroke-width="6"/>
      <path d="M-46 56 L-46 -56 L46 56 L46 -56" fill="none" stroke="#c0562c" stroke-width="24" stroke-linecap="square"/>
    </g>
    <text x="1036" y="330" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#6d6a63">1-COLOUR</text>
  </g>
  <g>
    <rect x="724" y="372" width="200" height="200" fill="#16233a"/>
    <g transform="translate(824,460) scale(0.62)">
      <polygon points="0,-104 104,0 0,104 -104,0" fill="none" stroke="#eef1f6" stroke-width="6"/>
      <path d="M-46 56 L-46 -56 L46 56 L46 -56" fill="none" stroke="#c0562c" stroke-width="24" stroke-linecap="square"/>
    </g>
    <text x="824" y="550" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#8f8b83">KNOCKOUT</text>
  </g>
  <g>
    <rect x="936" y="372" width="200" height="200" fill="#f5f2ea" stroke="#16233a" stroke-opacity="0.1"/>
    <rect x="936" y="372" width="200" height="200" fill="none" stroke="#c0562c" stroke-width="3"/>
    <g transform="translate(1036,470) scale(0.4)"><use href="#mk"/></g>
    <text x="1036" y="550" text-anchor="middle" font-size="10" font-family="Arial, Helvetica, sans-serif" fill="#6d6a63">CLEAR SPACE</text>
  </g>

  <rect x="40" y="650" width="1120" height="210" fill="#eef1f6" stroke="#16233a" stroke-opacity="0.1"/>
  <text x="64" y="682" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="4" fill="#6d6a63">LOCKUPS, MINIMUM SIZE &amp; COLOUR</text>
  <g transform="translate(120,770)">
    <g transform="scale(0.34)"><use href="#mk"/></g>
    <text x="70" y="8" font-family="Arial, Helvetica, sans-serif" font-size="26" letter-spacing="6" font-weight="bold" fill="#16233a">NORTHLINE</text>
  </g>
  <g transform="translate(560,770)">
    <text x="0" y="-14" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="6" font-weight="bold" fill="#16233a">NORTH</text>
    <text x="0" y="16" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="6" font-weight="bold" fill="#16233a">LINE</text>
  </g>
  <g transform="translate(760,770)">
    <g transform="scale(0.16)"><use href="#mk"/></g>
    <g transform="translate(60,0) scale(0.12)"><use href="#mk"/></g>
    <g transform="translate(104,0) scale(0.09)"><use href="#mk"/></g>
    <text x="0" y="40" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#6d6a63">MINIMUM SIZES</text>
  </g>
  <g>
    <rect x="930" y="712" width="70" height="70" fill="#16233a"/>
    <text x="930" y="802" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#6d6a63">#16233A</text>
    <rect x="1010" y="712" width="70" height="70" fill="#c0562c"/>
    <text x="1010" y="802" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#6d6a63">#C0562C</text>
    <rect x="1090" y="712" width="70" height="70" fill="#eef1f6" stroke="#16233a" stroke-opacity="0.15"/>
    <text x="1090" y="802" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#6d6a63">#EEF1F6</text>
  </g>

  <text x="40" y="884" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="3" fill="#8d8a80">SELF-INITIATED CONCEPT — FICTIONAL BRAND</text>
  <text x="1160" y="884" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="3" fill="#8d8a80">LOGOS / 02</text>
</svg>
