<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Nova Roast coffee launch key visual">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16130f"/>
      <stop offset="1" stop-color="#0a0908"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.36" cy="0.28" r="0.8">
      <stop offset="0" stop-color="#e4b95f" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#e4b95f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f0e5"/>
      <stop offset="1" stop-color="#e6dccb"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="sh2" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>

  <!-- poster card -->
  <g filter="url(#sh)" transform="rotate(-3 380 450)">
    <rect x="120" y="110" width="520" height="680" rx="6" fill="url(#cream)"/>
    <rect x="152" y="142" width="456" height="616" fill="none" stroke="#16281f" stroke-opacity="0.18"/>
    <circle cx="380" cy="330" r="120" fill="#efe6d7" stroke="#0f0d0b" stroke-width="3"/>
    <circle cx="380" cy="330" r="86" fill="#3a2415"/>
    <circle cx="380" cy="330" r="86" fill="none" stroke="#c98a4b" stroke-width="2" stroke-opacity="0.7"/>
    <path d="M300 214 q80 -34 160 0" fill="none" stroke="#0f0d0b" stroke-width="4" stroke-linecap="round"/>
    <text x="380" y="520" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="76" letter-spacing="2" fill="#0f0d0b">NOVA</text>
    <text x="380" y="592" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="76" letter-spacing="2" fill="#0f0d0b">ROAST</text>
    <line x1="248" y1="630" x2="512" y2="630" stroke="#b1822c" stroke-width="1.5"/>
    <text x="380" y="666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" letter-spacing="6" fill="#6b5a44">SINGLE ORIGIN COFFEE</text>
    <text x="380" y="716" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" letter-spacing="5" fill="#b1822c">LAUNCH WEEK — OPEN 7AM</text>
  </g>

  <!-- square post -->
  <g filter="url(#sh2)" transform="rotate(4 900 430)">
    <rect x="700" y="220" width="420" height="420" rx="6" fill="#12100e"/>
    <rect x="700" y="220" width="420" height="420" rx="6" fill="none" stroke="#e4b95f" stroke-opacity="0.35"/>
    <circle cx="910" cy="400" r="92" fill="none" stroke="#e4b95f" stroke-width="1.5"/>
    <circle cx="910" cy="400" r="64" fill="#c98a4b" fill-opacity="0.18"/>
    <path d="M846 372 q64 -30 128 0" fill="none" stroke="#e4b95f" stroke-width="2.5" stroke-linecap="round"/>
    <text x="910" y="536" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#f3ece1">New Season</text>
    <text x="910" y="574" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" letter-spacing="5" fill="#c98a4b">ESPRESSO BLEND</text>
  </g>

  <text x="120" y="828" font-family="Helvetica, Arial, sans-serif" font-size="15" letter-spacing="5" fill="#8f8b83">CONCEPT STUDY — KEY VISUAL / SOCIAL</text>
  <text x="1080" y="828" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="15" letter-spacing="5" fill="#e4b95f">01</text>
</svg>
