    <text x="864" y="334" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#33402b">Field Green</text>
    <text x="864" y="356" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6f6b64">#4D5B3F</text>
