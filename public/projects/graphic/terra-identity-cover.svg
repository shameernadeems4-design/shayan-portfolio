    <text x="864" y="258" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#33402b">Clay</text>
    <text x="864" y="280" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6f6b64">#C2703F</text>
