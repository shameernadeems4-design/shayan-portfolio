    <text x="816" y="690" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#33402b">Nils Aaberg</text>
    <text x="816" y="712" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="3" fill="#c2703f">LANDSCAPE ARCHITECT</text>
    <rect x="816" y="728" width="150" height="1" fill="#33402b" opacity="0.25"/>
    <text x="816" y="752" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#6f6b64">hello@example.com</text>
