  <text x="72" y="700" font-family="Georgia, 'Times New Roman', serif" font-size="150" fill="#33402b">Aa</text>
  <text x="72" y="748" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#33402b">Freight / Georgia — Display</text>
  <text x="72" y="776" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6f6b64">Grotesque for text and data.</text>
