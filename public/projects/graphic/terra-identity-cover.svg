<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Brand identity system board for Terra Forma showing logo lockup, palette, typography and cards">
  <defs>
    <clipPath id="tc"><circle r="104" cx="0" cy="0"/></clipPath>
    <g id="mk">
      <circle r="104" fill="none" stroke="#4d5b3f" stroke-width="2.5"/>
      <g clip-path="url(#tc)">
        <circle cx="-20" cy="-58" r="14" fill="#c2703f"/>
        <path d="M-104 32 Q-40 -40 10 26 T104 20" fill="none" stroke="#4d5b3f" stroke-width="3"/>
        <path d="M-104 60 Q-20 8 40 56 T104 50" fill="none" stroke="#c2703f" stroke-width="3"/>
      </g>
    </g>
  </defs>
  <rect width="1200" height="900" fill="#f2efe6"/>
  <text x="40" y="60" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="6" fill="#6d6a63">BRAND IDENTITY SYSTEM</text>
  <text x="1160" y="60" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="16" letter-spacing="4" fill="#33402b">TERRA FORMA</text>
