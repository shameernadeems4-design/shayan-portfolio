<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Agency website section layout and project list design">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131316"/>
      <stop offset="1" stop-color="#08080a"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>

  <g filter="url(#sh)">
    <rect x="90" y="90" width="1020" height="700" rx="10" fill="#0d0d0f"/>
    <line x1="90" y1="180" x2="1110" y2="180" stroke="#202024"/>

    <!-- stats row -->
    <text x="130" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="5" fill="#8f8b83">SELECTED WORK — 2024 / 2026</text>
    <text x="1070" y="152" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="5" fill="#e4b95f">VIEW ALL ↗</text>

    <!-- project 1 -->
    <g>
      <text x="130" y="240" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="4" fill="#6f6f6c">01</text>
      <text x="200" y="250" font-family="Georgia, 'Times New Roman', serif" font-size="42" fill="#f5f2ea">Maison Verte</text>
      <text x="200" y="282" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="2" fill="#8f8b83">IDENTITY SYSTEM · SIGNAGE · PRINT</text>
      <rect x="760" y="206" width="310" height="84" fill="#1a2f24"/>
      <rect x="790" y="228" width="40" height="40" fill="#c9a227"/>
      <text x="860" y="256" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#e9e3d7">Maison Verte</text>
      <line x1="130" y1="316" x2="1070" y2="316" stroke="#1c1c20"/>
    </g>

    <!-- project 2 -->
    <g>
      <text x="130" y="376" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="4" fill="#6f6f6c">02</text>
      <text x="200" y="386" font-family="Georgia, 'Times New Roman', serif" font-size="42" fill="#f5f2ea">Atlas Drop 002</text>
      <text x="200" y="418" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="2" fill="#8f8b83">CAMPAIGN · HANGTAGS · GARMENT BRANDING</text>
      <rect x="760" y="342" width="310" height="84" fill="#141414"/>
      <text x="820" y="396" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="26" fill="#f2f2f0">ATLAS</text>
      <rect x="1010" y="368" width="34" height="34" fill="#d8452e"/>
      <line x1="130" y1="452" x2="1070" y2="452" stroke="#1c1c20"/>
    </g>

    <!-- project 3 -->
    <g>
      <text x="130" y="512" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="4" fill="#6f6f6c">03</text>
      <text x="200" y="522" font-family="Georgia, 'Times New Roman', serif" font-size="42" fill="#f5f2ea">Nova Roast</text>
      <text x="200" y="554" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="2" fill="#8f8b83">PACKAGING · SOCIAL · STOREFRONT</text>
      <rect x="760" y="478" width="310" height="84" fill="#f4ede0"/>
      <rect x="790" y="496" width="36" height="48" fill="#12251c"/>
      <text x="850" y="530" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#12251c">Nova Roast</text>
      <line x1="130" y1="588" x2="1070" y2="588" stroke="#1c1c20"/>
    </g>

    <!-- footer band -->
    <rect x="90" y="640" width="1020" height="150" fill="#111114"/>
    <text x="130" y="700" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="30" letter-spacing="2" fill="#f5f2ea">LET'S MAKE SOMETHING</text>
    <text x="130" y="742" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="30" letter-spacing="2" fill="#e4b95f">WORTH LOOKING AT</text>
    <rect x="900" y="700" width="170" height="46" fill="#e4b95f"/>
    <text x="985" y="729" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="3" fill="#0d0d0f">START A PROJECT</text>
  </g>

  <text x="90" y="828" font-family="Helvetica, Arial, sans-serif" font-size="14" letter-spacing="5" fill="#8f8b83">SECTION SYSTEM — WORK LIST, HOVER STATES, FOOTER CTA</text>
</svg>
