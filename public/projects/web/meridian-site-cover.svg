<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Business website layout shown in a desktop browser frame">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1c21"/>
      <stop offset="1" stop-color="#0c0d10"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f0ec"/>
      <stop offset="1" stop-color="#e2e0d9"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- browser frame -->
  <g filter="url(#sh)">
    <rect x="90" y="90" width="1020" height="680" rx="12" fill="#f7f7f5"/>
    <rect x="90" y="90" width="1020" height="44" rx="12" fill="#20222a"/>
    <rect x="90" y="122" width="1020" height="12" fill="#20222a"/>
    <circle cx="120" cy="112" r="5.5" fill="#5b5f6b"/>
    <circle cx="140" cy="112" r="5.5" fill="#5b5f6b"/>
    <circle cx="160" cy="112" r="5.5" fill="#5b5f6b"/>
    <rect x="188" y="102" width="360" height="20" rx="10" fill="#2c2f38"/>
    <text x="206" y="117" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8f95a3">meridian.example</text>

    <!-- nav -->
    <rect x="90" y="134" width="1020" height="62" fill="#ffffff"/>
    <text x="130" y="174" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#111318">Meridian</text>
    <text x="640" y="172" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="2" fill="#5f636b">SERVICES</text>
    <text x="726" y="172" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="2" fill="#5f636b">APPROACH</text>
    <text x="836" y="172" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="2" fill="#5f636b">ABOUT</text>
    <rect x="962" y="152" width="112" height="30" fill="#111318"/>
    <text x="1018" y="172" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#f4f1ea">CONTACT</text>

    <!-- hero -->
    <rect x="90" y="196" width="1020" height="300" fill="url(#hero)"/>
    <text x="130" y="286" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="6" fill="#b1822c">STRATEGY &amp; OPERATIONS</text>
    <text x="128" y="360" font-family="Georgia, 'Times New Roman', serif" font-size="54" fill="#111318">Clear advice for</text>
    <text x="128" y="418" font-family="Georgia, 'Times New Roman', serif" font-size="54" fill="#111318">growing companies.</text>
    <rect x="130" y="446" width="168" height="36" fill="#111318"/>
    <text x="214" y="469" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#f4f1ea">BOOK A CALL</text>
    <g opacity="0.9">
      <rect x="820" y="250" width="240" height="200" fill="#ffffff"/>
      <rect x="844" y="278" width="120" height="10" fill="#d9d6cf"/>
      <rect x="844" y="300" width="192" height="6" fill="#e6e3dc"/>
      <rect x="844" y="314" width="160" height="6" fill="#e6e3dc"/>
      <rect x="844" y="348" width="192" height="1.5" fill="#d9d6cf"/>
      <rect x="844" y="368" width="150" height="6" fill="#e6e3dc"/>
      <rect x="844" y="382" width="176" height="6" fill="#e6e3dc"/>
      <rect x="844" y="406" width="90" height="26" fill="#b1822c"/>
    </g>

    <!-- service cards -->
    <g>
      <rect x="130" y="536" width="300" height="190" fill="#ffffff" stroke="#e4e2db"/>
      <rect x="158" y="566" width="34" height="34" fill="#111318"/>
      <text x="158" y="642" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#111318">Consulting</text>
      <rect x="158" y="666" width="200" height="6" fill="#e6e3dc"/>
      <rect x="158" y="682" width="160" height="6" fill="#e6e3dc"/>
      <rect x="466" y="536" width="300" height="190" fill="#ffffff" stroke="#e4e2db"/>
      <rect x="494" y="566" width="34" height="34" fill="#b1822c"/>
      <text x="494" y="642" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#111318">Audit</text>
      <rect x="494" y="666" width="200" height="6" fill="#e6e3dc"/>
      <rect x="494" y="682" width="140" height="6" fill="#e6e3dc"/>
      <rect x="802" y="536" width="288" height="190" fill="#111318"/>
      <rect x="830" y="566" width="34" height="34" fill="#f4f1ea"/>
      <text x="830" y="642" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#f4f1ea">Delivery</text>
      <rect x="830" y="666" width="200" height="6" fill="#3a3d45"/>
      <rect x="830" y="682" width="150" height="6" fill="#3a3d45"/>
    </g>
  </g>

  <text x="90" y="820" font-family="Helvetica, Arial, sans-serif" font-size="15" letter-spacing="5" fill="#8f8b83">WEB CONCEPT — BUSINESS SITE / DESKTOP</text>
  <text x="1110" y="820" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="15" letter-spacing="5" fill="#e4b95f">13</text>
</svg>
