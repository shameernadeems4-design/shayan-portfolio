<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Creative agency landing page design with oversized typography">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131316"/>
      <stop offset="1" stop-color="#08080a"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- browser frame -->
  <g filter="url(#sh)">
    <rect x="90" y="80" width="1020" height="700" rx="12" fill="#0d0d0f"/>
    <rect x="90" y="80" width="1020" height="40" rx="12" fill="#1c1c20"/>
    <rect x="90" y="108" width="1020" height="12" fill="#1c1c20"/>
    <rect x="188" y="90" width="340" height="20" rx="10" fill="#2a2a30"/>
    <text x="206" y="105" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8f95a3">studionorth.example</text>

    <!-- header -->
    <rect x="90" y="120" width="1020" height="66" fill="#0d0d0f"/>
    <text x="130" y="162" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="20" letter-spacing="3" fill="#f5f2ea">STUDIO NORTH</text>
    <text x="700" y="160" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="2" fill="#8f8b83">WORK</text>
    <text x="772" y="160" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="2" fill="#8f8b83">STUDIO</text>
    <text x="856" y="160" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="2" fill="#8f8b83">JOURNAL</text>
    <text x="962" y="160" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="2" fill="#e4b95f">LET'S TALK</text>
    <line x1="90" y1="186" x2="1110" y2="186" stroke="#26262c"/>

    <!-- hero type -->
    <text x="126" y="330" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="112" letter-spacing="-5" fill="#f5f2ea">DESIGN THAT</text>
    <text x="126" y="440" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="112" letter-spacing="-5" fill="#e4b95f">CARRIES</text>
    <text x="126" y="530" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#8f8b83">Brand systems, campaign artwork and websites for independent businesses.</text>
    <line x1="126" y1="576" x2="1074" y2="576" stroke="#26262c"/>

    <!-- work list -->
    <g>
      <text x="126" y="622" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#f5f2ea">Maison Verte — Identity</text>
      <text x="1040" y="622" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="3" fill="#8f8b83">BRANDING</text>
      <line x1="126" y1="648" x2="1074" y2="648" stroke="#1e1e22"/>
      <text x="126" y="692" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#f5f2ea">Atlas — Drop Campaign</text>
      <text x="1040" y="692" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="3" fill="#8f8b83">CAMPAIGN</text>
      <line x1="126" y1="718" x2="1074" y2="718" stroke="#1e1e22"/>
      <text x="126" y="760" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#f5f2ea">Nova Roast — Packaging</text>
      <text x="1040" y="760" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="3" fill="#8f8b83">PRINT</text>
    </g>
  </g>

  <text x="90" y="824" font-family="Helvetica, Arial, sans-serif" font-size="15" letter-spacing="5" fill="#8f8b83">WEB CONCEPT — AGENCY LANDING PAGE</text>
  <text x="1110" y="824" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="15" letter-spacing="5" fill="#e4b95f">14</text>
</svg>
