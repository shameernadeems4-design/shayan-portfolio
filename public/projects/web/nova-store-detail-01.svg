<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Product detail page and mobile cart design for a storefront">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1f1c"/>
      <stop offset="1" stop-color="#0b0d0c"/>
    </linearGradient>
    <linearGradient id="packet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4ede0"/><stop offset="1" stop-color="#ddd2be"/>
    </linearGradient>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- product page -->
  <g filter="url(#sh)">
    <rect x="90" y="120" width="760" height="660" fill="#f7f3ec"/>
    <rect x="130" y="164" width="340" height="400" fill="#efe7d8"/>
    <path d="M200 220 h200 v120 l-200 40 z" fill="url(#packet)"/>
    <path d="M200 220 h200 v26 h-200 z" fill="#12251c"/>
    <text x="300" y="300" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#12251c">Nova</text>
    <text x="300" y="332" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#12251c">Roast</text>
    <g>
      <rect x="150" y="588" width="70" height="70" fill="#e3ded3"/>
      <rect x="232" y="588" width="70" height="70" fill="#e3ded3"/>
      <rect x="314" y="588" width="70" height="70" fill="#e3ded3"/>
      <rect x="396" y="588" width="70" height="70" fill="#e3ded3"/>
    </g>
    <rect x="150" y="588" width="70" height="70" fill="none" stroke="#12251c" stroke-width="2"/>

    <text x="520" y="212" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="4" fill="#8a8579">SHOP / COFFEE / ETHIOPIA</text>
    <text x="520" y="284" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#12251c">Ethiopia Guji</text>
    <text x="520" y="326" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#5f6b5c">Washed · Light roast · 250g whole bean</text>
    <text x="1004" y="284" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#12251c">$18</text>
    <line x1="520" y1="356" x2="1004" y2="356" stroke="#12251c" stroke-opacity="0.15"/>
    <text x="520" y="410" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#4c4a45">Floral, citrus-forward, and gentle enough for a</text>
    <text x="520" y="434" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#4c4a45">morning without milk. Roasted in small lots.</text>

    <text x="520" y="494" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="4" fill="#8a8579">GRIND</text>
    <rect x="520" y="510" width="96" height="38" fill="none" stroke="#12251c" stroke-opacity="0.3"/>
    <text x="568" y="534" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4c4a45">Whole bean</text>
    <rect x="628" y="510" width="96" height="38" fill="#12251c"/>
    <text x="676" y="534" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#efe7d8">Filter</text>
    <rect x="736" y="510" width="96" height="38" fill="none" stroke="#12251c" stroke-opacity="0.3"/>
    <text x="784" y="534" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4c4a45">Espresso</text>

    <text x="520" y="600" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="4" fill="#8a8579">QUANTITY</text>
    <rect x="520" y="618" width="120" height="42" fill="none" stroke="#12251c" stroke-opacity="0.3"/>
    <text x="552" y="646" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#12251c">−</text>
    <text x="580" y="646" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#12251c">2</text>
    <text x="608" y="646" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#12251c">+</text>
    <rect x="660" y="618" width="344" height="42" fill="#c98a4b"/>
    <text x="832" y="646" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="4" fill="#12251c">ADD TO CART — $36</text>
    <text x="520" y="712" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#8a8579">Free delivery over $40 · Roasted to order</text>
  </g>

  <!-- mobile cart -->
  <g filter="url(#sh)">
    <rect x="880" y="200" width="240" height="500" rx="20" fill="#f7f3ec"/>
    <rect x="960" y="214" width="80" height="7" rx="3.5" fill="#20221f"/>
    <text x="904" y="266" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#12251c">Your cart</text>
    <text x="1096" y="266" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8a8579">2 items</text>
    <line x1="904" y1="282" x2="1096" y2="282" stroke="#12251c" stroke-opacity="0.15"/>
    <rect x="904" y="300" width="60" height="60" fill="#efe7d8"/>
    <text x="976" y="322" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#12251c">Ethiopia Guji</text>
    <text x="976" y="342" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8a8579">Filter · 250g</text>
    <text x="1096" y="342" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#12251c">$18</text>
    <rect x="904" y="380" width="60" height="60" fill="#e6e0d4"/>
    <text x="976" y="402" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#12251c">House Blend</text>
    <text x="976" y="422" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8a8579">Whole bean · 250g</text>
    <text x="1096" y="422" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#12251c">$15</text>
    <line x1="904" y1="470" x2="1096" y2="470" stroke="#12251c" stroke-opacity="0.15"/>
    <text x="904" y="502" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5f6b5c">Subtotal</text>
    <text x="1096" y="502" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#12251c">$33</text>
    <rect x="904" y="530" width="192" height="40" fill="#12251c"/>
    <text x="1000" y="555" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="3" fill="#efe7d8">CHECKOUT</text>
    <text x="1000" y="600" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" letter-spacing="3" fill="#a8a49b">3-STEP CHECKOUT</text>
    <rect x="940" y="622" width="120" height="56" fill="#efe7d8"/>
    <text x="1000" y="648" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5f6b5c">Card · Apple Pay · Bank</text>
    <text x="1000" y="666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5f6b5c">transfer</text>
  </g>

  <text x="90" y="828" font-family="Helvetica, Arial, sans-serif" font-size="14" letter-spacing="5" fill="#8f8b83">PRODUCT DETAIL + MOBILE CART</text>
  <text x="1110" y="828" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="14" letter-spacing="5" fill="#c98a4b">E-COMMERCE</text>
</svg>
