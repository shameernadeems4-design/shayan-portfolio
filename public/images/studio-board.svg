<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="Concept print pieces arranged on a dark studio surface">
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d1d22"/>
      <stop offset="1" stop-color="#101012"/>
    </linearGradient>
    <linearGradient id="cardA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f2ea"/>
      <stop offset="1" stop-color="#e4ded1"/>
    </linearGradient>
    <linearGradient id="cardB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16281f"/>
      <stop offset="1" stop-color="#101a15"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#board)"/>
  <g opacity="0.5" stroke="#f5f2ea" stroke-opacity="0.05">
    <path d="M0 150H1200M0 300H1200M0 450H1200M0 600H1200M0 750H1200"/>
    <path d="M150 0V900M300 0V900M450 0V900M600 0V900M750 0V900M900 0V900M1050 0V900"/>
  </g>

  <ellipse cx="420" cy="300" rx="300" ry="220" fill="#e4b95f" opacity="0.12" filter="url(#soft)"/>

  <g transform="rotate(-8 430 470)">
    <rect x="240" y="250" width="380" height="240" rx="6" fill="url(#cardA)"/>
    <rect x="240" y="250" width="380" height="240" rx="6" fill="none" stroke="#0a0a0b" stroke-opacity="0.08"/>
    <rect x="268" y="278" width="60" height="60" fill="#16281f"/>
    <text x="298" y="318" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#e9e3d7">MV</text>
    <rect x="268" y="380" width="200" height="2" fill="#b1822c"/>
    <rect x="268" y="400" width="140" height="2" fill="#0a0a0b" opacity="0.15"/>
    <rect x="268" y="418" width="180" height="2" fill="#0a0a0b" opacity="0.15"/>
  </g>

  <g transform="rotate(6 780 340)">
    <rect x="620" y="180" width="300" height="360" rx="4" fill="url(#cardB)"/>
    <rect x="620" y="180" width="300" height="360" rx="4" fill="none" stroke="#e4b95f" stroke-opacity="0.35"/>
    <circle cx="770" cy="300" r="54" fill="none" stroke="#e4b95f" stroke-opacity="0.7"/>
    <circle cx="770" cy="300" r="34" fill="none" stroke="#e4b95f" stroke-opacity="0.4" stroke-dasharray="3 6"/>
    <rect x="660" y="420" width="220" height="2" fill="#e9e3d7" opacity="0.5"/>
    <rect x="660" y="440" width="150" height="2" fill="#e9e3d7" opacity="0.25"/>
    <rect x="660" y="480" width="90" height="2" fill="#b1822c"/>
  </g>

  <g transform="rotate(-3 320 700)">
    <rect x="180" y="600" width="260" height="140" rx="4" fill="#efead9"/>
    <rect x="196" y="616" width="228" height="108" fill="none" stroke="#1f2a1c" stroke-opacity="0.4"/>
    <text x="310" y="672" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#1f2a1c">GOLDEN LEAF</text>
    <text x="310" y="696" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="4" fill="#7d8b6a">OLIVE OIL</text>
  </g>

  <g transform="rotate(11 900 720)">
    <rect x="800" y="620" width="200" height="110" rx="4" fill="#f2f2f0"/>
    <rect x="816" y="636" width="168" height="78" fill="none" stroke="#0a0a0a" stroke-opacity="0.18"/>
    <text x="900" y="672" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="26" fill="#0a0a0a">ATLAS</text>
    <rect x="860" y="686" width="80" height="2" fill="#d8452e"/>
  </g>

  <rect x="60" y="60" width="120" height="2" fill="#e4b95f" opacity="0.7"/>
  <text x="60" y="110" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="6" fill="#8f8b83">PRINT PRODUCTION STUDIES</text>
</svg>
